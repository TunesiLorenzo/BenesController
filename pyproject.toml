[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "benes-controller"
version = "0.1.0"
description = "Desktop controller and measurement suite for a 6x6 Benes optical switch"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "coverage[toml]>=7.6",
    "ruff>=0.8",
]

[tool.coverage.run]
branch = true
source = ["benes"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F"]
